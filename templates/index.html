<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MV Pulse">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icons/mv-icon.svg" type="image/svg+xml">
<title>MV Pulse — Voice-first video from Africa</title>
<script src="/static/pwa.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#fe2c55;--accent2:#25f4ee;--bg:#000;--surface:#161616;--surface2:#2a2a2a;--border:rgba(255,255,255,.12);--text:#fff;--muted:rgba(255,255,255,.65);--subtle:rgba(255,255,255,.35)}
html,body{height:100%;background:#000;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,a{cursor:pointer;border:none;background:none;color:inherit;font:inherit;text-decoration:none}
input{font:inherit;color:inherit;background:none;border:none;outline:none}

/* HERO */
.hero{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:0}
.hero-bg video{width:100%;height:100%;object-fit:cover;opacity:.5}
.hero-bg-static{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(254,44,85,.4),transparent 55%),radial-gradient(ellipse at 70% 80%,rgba(37,244,238,.25),transparent 55%),linear-gradient(180deg,#0a0a0a,#000)}
.hero-bg::after{content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.15) 0%,rgba(0,0,0,.05) 30%,rgba(0,0,0,.6) 70%,rgba(0,0,0,.95) 100%)}

/* BRAND — top third */
.hero-content{position:relative;z-index:1;display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;height:100%;
  padding:env(safe-area-inset-top,20px) 0 env(safe-area-inset-bottom,0px)}
.brand{display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:1;gap:10px;padding-top:32px}
.logo{font-size:clamp(44px,12vw,72px);font-weight:900;letter-spacing:-2px;
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1}
.tagline{font-size:clamp(14px,4vw,18px);font-weight:500;color:rgba(255,255,255,.75);
  letter-spacing:.5px;text-align:center}

/* CTA STACK — bottom */
.cta-stack{width:100%;max-width:360px;padding:0 24px calc(32px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px}
.btn-primary{background:var(--accent);color:#fff;font-size:17px;font-weight:800;
  padding:17px 24px;border-radius:14px;text-align:center;width:100%;
  transition:transform .1s,opacity .1s}
.btn-primary:active{transform:scale(.97);opacity:.9}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;
  background:#fff;color:#333;font-size:15px;font-weight:700;
  padding:15px 24px;border-radius:14px;width:100%;
  transition:transform .1s,opacity .1s}
.btn-google:active{transform:scale(.97);opacity:.9}
.btn-google svg{flex-shrink:0}
.signin-row{text-align:center;font-size:14px;color:rgba(255,255,255,.55);padding-top:4px}
.signin-row button{color:#fff;font-weight:700;font-size:14px}
.btn-install{display:flex;align-items:center;justify-content:center;gap:10px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;
  font-size:15px;font-weight:700;padding:15px 24px;border-radius:14px;width:100%;
  transition:transform .1s,opacity .1s}
.btn-install:active{transform:scale(.97);opacity:.9}
.btn-install svg{flex-shrink:0;stroke:var(--accent2)}
.hidden{display:none!important}

/* AUTH SLIDE-UP */
.auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  z-index:200;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s}
.auth-overlay.open{opacity:1;pointer-events:all}
.auth-panel{background:var(--surface);border-radius:24px 24px 0 0;
  width:100%;max-width:480px;padding:12px 24px calc(24px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px;
  transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1)}
.auth-overlay.open .auth-panel{transform:translateY(0)}
.auth-handle{width:40px;height:4px;background:rgba(255,255,255,.18);border-radius:2px;margin:0 auto 4px}
.auth-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:2px}
.auth-tab{flex:1;text-align:center;padding:11px;font-size:15px;font-weight:800;
  color:var(--muted);border-bottom:2px solid transparent;transition:all .2s}
.auth-tab.active{color:#fff;border-bottom-color:var(--accent)}
.aerr{background:rgba(254,44,85,.1);border:1px solid rgba(254,44,85,.3);
  border-radius:8px;padding:10px 14px;font-size:13px;color:#ff6b6b}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;
  background:#fff;color:#333;font-size:15px;font-weight:700;padding:14px;border-radius:12px}
.gbtn:active{transform:scale(.97)}
.adiv{display:flex;align-items:center;gap:10px;color:var(--subtle);font-size:12px}
.adiv::before,.adiv::after{content:'';flex:1;height:1px;background:var(--border)}
.ainput{display:block;background:var(--surface2);border-radius:10px;
  padding:14px 16px;font-size:15px;color:#fff;width:100%}
.ainput::placeholder{color:var(--subtle)}
.asub{background:var(--accent);color:#fff;font-size:16px;font-weight:800;
  padding:16px;border-radius:12px;width:100%;text-align:center;display:block}
.asub:active{transform:scale(.97)}
.aform-wrap{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
{% if current_user %}<script>location.replace('/feed');</script>{% endif %}

<!-- HERO -->
<div class="hero">
  <div class="hero-bg">
    {% if featured_public_video and featured_public_video.video_url %}
    <video src="{{ featured_public_video.video_url }}" autoplay muted loop playsinline></video>
    {% endif %}
    <div class="hero-bg-static"></div>
  </div>
  <div class="hero-content">
    <div class="brand">
      <h1 class="logo">MV Pulse</h1>
      <p class="tagline">Voice. Video. Africa.</p>
    </div>
    <div class="cta-stack">
      <button type="button" class="btn-primary" onclick="openAuth('signup')">Get Started</button>
      <a class="btn-google" href="/auth/google">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
        Continue with Google
      </a>
      <button type="button" class="btn-install" data-install-app hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Add to Home Screen
      </button>
      <p class="signin-row">Already have an account? <button type="button" onclick="openAuth('login')">Log in</button></p>
    </div>
  </div>
</div>

<!-- AUTH SLIDE-UP -->
<div class="auth-overlay" id="auth-overlay" onclick="handleOverlayClick(event)">
  <div class="auth-panel" id="auth-panel">
    <div class="auth-handle"></div>
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
      <button type="button" class="auth-tab" id="tab-signup" onclick="switchAuthTab('signup')">Sign Up</button>
    </div>
    {% if auth_message %}<div class="aerr">{{ auth_message }}</div>{% endif %}
    <a class="gbtn" href="/auth/google">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
      Continue with Google
    </a>
    <div class="adiv">or</div>
    <form id="login-form" action="/login" method="POST">
      <input type="hidden" name="remember_me" value="true">
      <div class="aform-wrap">
        <input class="ainput" name="email" type="email" placeholder="Email" required autocomplete="email">
        <input class="ainput" name="password" type="password" placeholder="Password" required autocomplete="current-password">
        <button class="asub" type="submit">Sign In</button>
      </div>
    </form>
    <form id="signup-form" action="/signup" method="POST" class="hidden">
      <div class="aform-wrap">
        <input class="ainput" name="username" type="text" placeholder="Username" required autocomplete="username">
        <input class="ainput" name="email" type="email" placeholder="Email" required autocomplete="email">
        <input class="ainput" name="password" type="password" placeholder="Password (min 8 chars)" required autocomplete="new-password">
        <input class="ainput" name="password_confirmation" type="password" placeholder="Confirm password" required>
        <button class="asub" type="submit">Create Account</button>
      </div>
    </form>
  </div>
</div>

<script>
function openAuth(tab){
  switchAuthTab(tab);
  document.getElementById('auth-overlay').classList.add('open');
}
function closeAuth(){
  document.getElementById('auth-overlay').classList.remove('open');
}
function handleOverlayClick(e){if(e.target===document.getElementById('auth-overlay'))closeAuth();}
function switchAuthTab(tab){
  document.getElementById('tab-login').classList.toggle('active',tab==='login');
  document.getElementById('tab-signup').classList.toggle('active',tab==='signup');
  document.getElementById('login-form').style.display=tab==='login'?'':'none';
  document.getElementById('signup-form').style.display=tab==='signup'?'':'none';
}
{% if auth_message %}setTimeout(()=>openAuth('login'),200);{% endif %}
</script>
</body>
</html>
